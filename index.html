<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Papershelf</title><meta name="description" content="Papershelf — 글과 생각을 모아두는 블로그">
<link rel="stylesheet" href="./assets/css/styles.css">
<link rel="stylesheet" href="./assets/css/blog.css">
</head>
<body>
<canvas id="fjord-background" aria-hidden="true"></canvas>
<nav aria-label="주 메뉴"><span class="small mark" aria-hidden="true">◩</span><button class="small" id="account">LOGIN</button></nav>
<header class="hero"><h1><span class="archive-title"><span class="sr-only">Papershelf</span><span class="scramble" aria-hidden="true">Papershelf</span><span class="title-cursor" aria-hidden="true">_</span></span><sup id="total"></sup></h1></header>
<main class="layout"><aside aria-label="토픽 필터"><div class="side-head"><span class="label">/ FILTERS</span><button class="reset" id="edit-topics" hidden data-admin>수정</button></div><p class="topic-head">Topic</p><div class="topics" id="topics"></div></aside><section aria-label="기록 목록"><div class="list-tools"><input class="search" id="search" type="search" aria-label="기록 검색" placeholder="제목, 내용, 토픽 검색 ↵"></div><div class="table-head label"><span class="date-label">/ DATE</span><span>/ NAME <span id="results"></span></span><button id="sort" aria-label="정렬 변경">최신순 ↓</button></div><button type="button" id="add" class="entry-add" hidden data-admin aria-label="글 작성" aria-expanded="false" aria-controls="editor">＋</button>
<section id="editor" aria-label="글 작성" hidden><form id="form"><h2 id="form-title" class="sr-only">글 작성</h2><div class="fields"><div class="note-meta"><label class="meta-date"><span class="sr-only">날짜</span><input name="date" type="date" required></label></div><label class="note-title"><span class="sr-only">제목</span><input name="title" maxlength="180" required placeholder="제목"></label><fieldset class="note-topics"><legend class="sr-only">토픽</legend><div id="entry-topics" class="entry-topics"></div></fieldset><div class="write-tabs" role="tablist" aria-label="본문 보기"><button type="button" role="tab" aria-selected="true" data-tab="write">쓰기</button><button type="button" role="tab" aria-selected="false" data-tab="preview">미리보기</button><button type="button" class="photo-add" id="photo-add">+ 사진</button><input type="file" id="photo-file" accept="image/*" multiple hidden></div><label class="note-body"><span class="sr-only">내용</span><textarea name="body" maxlength="200000" placeholder="내용" spellcheck="false"></textarea></label><div class="prose md-preview" id="md-preview" hidden></div></div><p id="editor-message" class="editor-message" role="status"></p><div class="form-actions"><label class="publish-option"><input type="checkbox" id="publish-entry">공개 발행</label><button class="small" type="button" id="cancel">취소</button><button class="small active" type="submit">저장</button></div></form></section><div id="entries"></div></section></main>

<div class="status" role="status" id="status"></div>
<dialog id="account-dialog" aria-labelledby="account-title"><div id="login-panel" class="account-form"><h2 id="account-title">Papershelf</h2><button class="small active" id="github-login" type="button">GitHub로 로그인</button></div><div id="account-actions" hidden><p id="account-email"></p><button class="small" id="logout">로그아웃</button></div><p id="account-message" role="status"></p><button class="small" id="close-account">닫기</button></dialog><p id="load-error" role="alert" hidden></p>
<script src="./assets/js/supabase.js"></script>
<script src="./assets/js/blog-client.js"></script>
<script src="./assets/js/vendor.js"></script>
<script src="./assets/js/app.js"></script>
<script src="./assets/js/entry-export.js"></script>
<script src="./assets/js/blog.js"></script>
<script src="./assets/js/title-animation.js"></script>
</body>
</html>
